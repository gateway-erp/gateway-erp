<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway — Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:      #0F1F3D;
      --navy-mid:  #162644;
      --navy-card: #1C3056;
      --navy-line: #243a66;
      --accent:    #3B82F6;
      --accent-h:  #2563EB;
      --green:     #22C55E;
      --amber:     #F59E0B;
      --red:       #EF4444;
      --text:      #F0F4FF;
      --text-dim:  #8BA3CC;
      --font:      'Montserrat', sans-serif;
      --font-num:  'Inter', sans-serif;
    }
    body { background: var(--navy); color: var(--text); font-family: var(--font); min-height: 100vh; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--navy-mid); border-bottom: 1px solid var(--navy-line);
      padding: 0 32px; height: 64px; display: flex; align-items: center;
      gap: 32px; position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo { height: 36px; width: auto; }
    .topbar-home { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; text-decoration: none; line-height: 1; }
    .topbar-home-lbl { font-size: 9px; font-weight: 600; color: var(--text-dim); letter-spacing: .3px; transition: color .15s; }
    .topbar-home:hover .topbar-home-lbl { color: var(--accent); }
    .topbar-sep  { width: 1px; height: 28px; background: var(--navy-line); }
    .topbar-nav  { display: flex; gap: 4px; flex: 1; }
    .nav-item {
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
      color: var(--text-dim); text-decoration: none; transition: background .15s, color .15s;
    }
    .nav-item:hover  { background: var(--navy-card); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }

    /* ── PAGE ── */
    .page { width: 100%; padding: 22px 24px; }

    /* ── HEADER ── */
    .hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .hdr-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .page-title { font-size: 17px; font-weight: 700; }

    .sem-nav { display: flex; align-items: center; gap: 6px; }
    .sem-btn {
      background: var(--navy-card); border: 1px solid var(--navy-line); color: var(--text);
      border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, color .15s;
    }
    .sem-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sem-label { font-family: var(--font-num); font-size: 13px; font-weight: 600; min-width: 220px; text-align: center; }

    .hdr-right { display: flex; align-items: center; gap: 8px; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--navy-line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinning { display: inline-block !important; }

    .modo-toggle { display: flex; background: var(--navy); border: 1px solid var(--navy-line); border-radius: 8px; padding: 3px; }
    .modo-btn { padding: 4px 14px; border: none; border-radius: 5px; cursor: pointer; font-family: var(--font); font-size: 11px; font-weight: 600; color: var(--text-dim); background: none; transition: background .15s, color .15s; }
    .modo-btn.active { background: var(--accent); color: #fff; }

    .btn-fill { background: rgba(59,130,246,.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 5px 12px; font-family: var(--font); font-size: 11px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-fill:hover { background: rgba(59,130,246,.25); }

    /* ── RESUMEN MES ── */
    .resumen {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px;
      background: var(--navy-card); border: 1px solid var(--navy-line);
      border-radius: 8px; margin-bottom: 16px; align-items: center;
    }
    .res-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); margin-right: 4px; }
    .res-chip { display: flex; align-items: center; gap: 5px; background: var(--navy); border: 1px solid var(--navy-line); border-radius: 5px; padding: 4px 8px; font-size: 10px; }
    .res-nombre { color: var(--text-dim); font-weight: 600; font-size: 9px; text-transform: uppercase; letter-spacing: .3px; }
    .res-dots { display: flex; gap: 3px; }
    .res-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--navy-line); }
    .res-dot.done    { background: var(--green); }
    .res-dot.pending { background: var(--amber); }
    .res-dot.over    { background: var(--red); }
    .res-empty { font-size: 11px; color: var(--text-dim); }

    /* ── GRILLA SEMANAL ── */
    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border: 1px solid var(--navy-line); border-radius: 10px;
      overflow: hidden; background: var(--navy-card);
      margin-bottom: 14px;
    }
    .day-col { border-right: 1px solid var(--navy-line); display: flex; flex-direction: column; min-height: 160px; }
    .day-col:last-child { border-right: none; }
    .day-col.is-today { background: rgba(59,130,246,.07); }
    .day-col.is-past  { opacity: .75; }
    .day-col.is-finde { background: rgba(0,0,0,.12); }

    .day-head {
      padding: 7px 10px; border-bottom: 1px solid var(--navy-line);
      background: var(--navy-mid); display: flex; align-items: baseline; gap: 6px;
    }
    .day-dow  { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); }
    .day-num  { font-family: var(--font-num); font-size: 16px; font-weight: 700; color: var(--text); }
    .day-mes  { font-size: 8px; color: var(--text-dim); }
    .day-col.is-today .day-num { color: var(--accent); }
    .day-hoy-badge { font-size: 8px; background: var(--accent); color: #fff; border-radius: 3px; padding: 1px 5px; font-weight: 700; margin-left: auto; }

    .day-body { flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 4px; }

    /* ── CARDS MANTENIMIENTO ── */
    .mcard {
      border-radius: 5px; padding: 5px 7px; font-size: 10px; font-weight: 600;
      cursor: pointer; display: flex; align-items: flex-start; gap: 4px;
      border: 1px solid transparent; transition: filter .15s, transform .1s;
      line-height: 1.35;
    }
    .mcard:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .mcard.st-pendiente { background: rgba(245,158,11,.14); border-color: rgba(245,158,11,.4);  color: #fde68a; }
    .mcard.st-realizado { background: rgba(34,197,94,.1);  border-color: rgba(34,197,94,.3);   color: #86efac; opacity: .72; }
    .mcard.st-vencido   { background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.4);   color: #fca5a5; }

    .mcard-dot  { width: 6px; height: 6px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
    .st-pendiente .mcard-dot { background: var(--amber); }
    .st-realizado .mcard-dot { background: var(--green); }
    .st-vencido   .mcard-dot { background: var(--red); }

    .mcard-body { flex: 1; }
    .mcard-nombre { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 120px; }
    .mcard-tec    { font-size: 8px; opacity: .7; display: block; }
    .mcard-check  { font-size: 11px; margin-left: auto; flex-shrink: 0; }

    /* ── ÁREA LIBRE ── */
    .libre-wrap { padding: 0 6px 6px; margin-top: auto; }
    .libre-ta {
      width: 100%; background: none; border: 1px dashed rgba(36,58,102,.8);
      border-radius: 4px; color: var(--text-dim); font-family: var(--font);
      font-size: 9px; padding: 4px 6px; resize: none; outline: none;
      transition: border-color .15s, color .15s; min-height: 30px; line-height: 1.5;
    }
    .libre-ta:focus   { border-color: var(--accent); color: var(--text); border-style: solid; }
    .libre-ta::placeholder { color: var(--navy-line); }

    /* ── PENDIENTES SIN ASIGNAR ── */
    .pendientes-sec {
      background: rgba(239,68,68,.07); border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 14px;
    }
    .pend-title { font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .pend-list  { display: flex; flex-wrap: wrap; gap: 6px; }
    .pend-chip  {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px; padding: 5px 10px; font-size: 10px; font-weight: 600;
      color: #fca5a5; cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background .15s;
    }
    .pend-chip:hover { background: rgba(239,68,68,.2); }
    .pend-chip-sub { font-size: 9px; opacity: .7; font-weight: 400; }

    /* ── WS PANEL ── */
    .ws-panel { background: var(--navy-card); border: 1px solid var(--navy-line); border-radius: 10px; padding: 14px 18px; }
    .ws-head  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); margin-bottom: 12px; }
    .ws-row   { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-start; }
    .ws-fld   { display: flex; flex-direction: column; gap: 3px; }
    .ws-lbl   { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); }
    .ws-sel   { background: var(--navy); border: 1px solid var(--navy-line); color: var(--text); border-radius: 6px; padding: 6px 10px; font-family: var(--font); font-size: 12px; outline: none; min-width: 180px; }
    .ws-ta    { background: var(--navy); border: 1px solid var(--navy-line); color: var(--text); border-radius: 6px; padding: 6px 10px; font-family: var(--font); font-size: 12px; outline: none; width: 300px; resize: vertical; min-height: 36px; }
    .ws-sel:focus, .ws-ta:focus { border-color: var(--accent); }
    /* ── EQUIPOS DE TRABAJO ── */
    .ws-equipo { background: var(--navy); border: 1px solid var(--navy-line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .ws-equipo-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .ws-tec-chks { display: flex; gap: 6px; flex-wrap: wrap; }
    .ws-tec-chk { padding: 4px 10px; border: 1px solid var(--navy-line); border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: background .15s, border-color .15s, color .15s; user-select: none; }
    .ws-tec-chk.active { background: rgba(59,130,246,.2); border-color: var(--accent); color: var(--text); }
    .ws-equipo-rm { font-size: 10px; color: var(--text-dim); cursor: pointer; white-space: nowrap; }
    .ws-equipo-rm:hover { color: var(--red); }
    .ws-turno-btn { padding: 3px 6px; border: 1px solid var(--navy-line); border-radius: 5px; font-size: 11px; cursor: pointer; transition: border-color .15s, background .15s; user-select: none; line-height: 1; opacity: .4; }
    .ws-turno-btn.active { border-color: var(--accent); background: rgba(59,130,246,.15); opacity: 1; }
    .ws-btn-agregar { background: rgba(59,130,246,.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 5px 12px; font-family: var(--font); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s; }
    .ws-btn-agregar:hover { background: rgba(59,130,246,.25); }
    .ws-tareas { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .ws-tarea-item { display: flex; align-items: center; justify-content: space-between; background: var(--navy-card); border-radius: 5px; padding: 5px 9px; font-size: 12px; gap: 8px; border: 1px solid transparent; }
    .ws-tarea-item.sin-confirmar { border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.06); }
    .ws-tarea-flag { font-size: 9px; color: var(--amber); font-style: normal; font-weight: 600; }
    .ws-tarea-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ws-tarea-rm { cursor: pointer; color: var(--text-dim); font-size: 11px; padding-left: 4px; }
    .ws-tarea-rm:hover { color: var(--red); }
    .ws-tarea-empty { font-size: 11px; color: var(--text-dim); font-style: italic; padding: 3px 0; }
    .ws-tarea-add { display: flex; gap: 6px; flex-wrap: wrap; }
    .ws-sel-sm, .ws-inp-sm { background: var(--navy-card); border: 1px solid var(--navy-line); color: var(--text); border-radius: 6px; padding: 5px 8px; font-family: var(--font); font-size: 11px; outline: none; }
    .ws-sel-sm { min-width: 170px; }
    .ws-inp-sm { flex: 1; min-width: 140px; }
    .ws-sel-sm:focus, .ws-inp-sm:focus { border-color: var(--accent); }
    .btn-add-equipo { background: none; border: 1px dashed var(--navy-line); color: var(--text-dim); border-radius: 7px; padding: 6px 14px; font-family: var(--font); font-size: 11px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: border-color .15s, color .15s; }
    .btn-add-equipo:hover { border-color: var(--accent); color: var(--accent); }

    .ws-prev  { background: var(--navy); border: 1px solid var(--navy-line); border-radius: 8px; padding: 10px 14px; font-family: var(--font-num); font-size: 12px; line-height: 1.8; color: var(--text); white-space: pre-wrap; min-height: 60px; margin-bottom: 8px; }
    .ws-actions-row { display: flex; gap: 8px; }
    .btn-copy { background: var(--green); color: #fff; border: none; border-radius: 7px; padding: 7px 18px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-copy:hover   { background: #16a34a; }
    .btn-copy.copied  { background: var(--navy-line); }
    .btn-img { background: rgba(59,130,246,.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 7px; padding: 7px 18px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-img:hover  { background: rgba(59,130,246,.28); }
    .btn-img.copied { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-confirmar { background: rgba(59,130,246,.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 7px; padding: 7px 18px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-confirmar:hover:not(:disabled) { background: rgba(59,130,246,.25); }
    .btn-confirmar:disabled { opacity: .6; cursor: default; }

    /* ── MODAL ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 300; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: var(--navy-card); border: 1px solid var(--navy-line); border-radius: 12px; padding: 22px; min-width: 300px; max-width: 420px; width: 90%; }
    .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .modal-sub   { font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }

    .modal-label { font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
    .modal-fecha { background: var(--navy); border: 1px solid var(--navy-line); color: var(--text); border-radius: 6px; padding: 6px 10px; font-family: var(--font-num); font-size: 13px; outline: none; width: 100%; margin-bottom: 10px; }
    .modal-fecha:focus { border-color: var(--accent); }

    .turno-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .turno-btn { flex: 1; padding: 7px; border: 1px solid var(--navy-line); background: var(--navy); color: var(--text-dim); border-radius: 6px; font-family: var(--font); font-size: 11px; cursor: pointer; transition: border-color .15s, color .15s; }
    .turno-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,.1); }

    .modal-actions { display: flex; flex-direction: column; gap: 6px; }
    .mbtn { padding: 9px 12px; border: 1px solid var(--navy-line); background: var(--navy); color: var(--text); border-radius: 7px; font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; text-align: center; }
    .mbtn:hover { border-color: var(--accent); }
    .mbtn.green  { border-color: var(--green); background: rgba(34,197,94,.1); color: var(--green); }
    .mbtn.green:hover { background: rgba(34,197,94,.2); }
    .mbtn.amber  { border-color: var(--amber); background: rgba(245,158,11,.1); color: var(--amber); }
    .mbtn.amber:hover { background: rgba(245,158,11,.2); }
    .mbtn.red    { border-color: var(--red); background: rgba(239,68,68,.08); color: var(--red); }
    .mbtn.red:hover { background: rgba(239,68,68,.18); }
    .mbtn.ghost  { color: var(--text-dim); font-weight: 400; }
    .mbtn-row    { display: flex; gap: 6px; }
    .mbtn-row .mbtn { flex: 1; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a href="/" class="topbar-home" title="Volver al inicio">
    <img src="/static/logo-gateway.jpeg" alt="Gateway" class="topbar-logo">
    <span class="topbar-home-lbl">Dashboard</span>
  </a>
  <div class="topbar-sep"></div>
  <nav class="topbar-nav">
    <a class="nav-item" href="/">Dashboard</a>
    <a class="nav-item" href="/matrices">Matrices</a>
    <a class="nav-item" href="/clientes">Clientes</a>
    <a class="nav-item" href="/remito">Remitos</a>
    <a class="nav-item active" href="/agenda">Agenda</a>
  </nav>
</div>

<div class="page">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-left">
      <span class="page-title">Agenda</span>
      <div class="sem-nav">
        <button class="sem-btn" onclick="semAnt()">‹</button>
        <span class="sem-label" id="sem-label">—</span>
        <button class="sem-btn" onclick="semSig()">›</button>
      </div>
      <button class="sem-btn" onclick="irHoy()" title="Ir a hoy" style="width:auto;padding:0 10px;font-size:11px;font-weight:600;">Hoy</button>
    </div>
    <div class="hdr-right">
      <div class="spinner" id="spin"></div>
      <div class="modo-toggle">
        <button class="modo-btn active" id="btn-auto"   onclick="setModo('auto')">Automático</button>
        <button class="modo-btn"        id="btn-manual" onclick="setModo('manual')">Manual</button>
      </div>
      <button class="btn-fill" id="btn-fill" onclick="doAutoFill()">↻ Completar mes</button>
    </div>
  </div>

  <!-- RESUMEN MES -->
  <div class="resumen" id="resumen"><span class="res-empty">Cargando…</span></div>

  <!-- GRILLA SEMANAL -->
  <div class="week-grid" id="week-grid">
    <!-- JS renderiza 5 columnas -->
  </div>

  <!-- ARRASTRADOS DE MESES ANTERIORES -->
  <div class="pendientes-sec" id="arr-sec" style="display:none; background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.3);">
    <div class="pend-title" style="color:var(--amber);">↩ Arrastrados de meses anteriores — nunca se resolvieron</div>
    <div class="pend-list" id="arr-list"></div>
  </div>

  <!-- PENDIENTES -->
  <div class="pendientes-sec" id="pend-sec" style="display:none;">
    <div class="pend-title">⚠ Pendientes sin fecha asignada este mes</div>
    <div class="pend-list" id="pend-list"></div>
  </div>

  <!-- WS PANEL -->
  <div class="ws-panel">
    <div class="ws-head">📱 Mensaje para el grupo</div>
    <div class="ws-row">
      <div class="ws-fld">
        <label class="ws-lbl">Día</label>
        <select class="ws-sel" id="ws-dia" onchange="wsPoblarDesdeDia(this.value); renderWsEquipos(); genMsg();">
          <option value="">— Seleccionar —</option>
        </select>
      </div>
      <div class="ws-fld" style="flex:1;">
        <label class="ws-lbl">Nota extra</label>
        <textarea class="ws-ta" id="ws-nota" placeholder="Ej: Recuerden llevar los insumos y pasar por mi casa…" oninput="genMsg()" rows="2"></textarea>
      </div>
    </div>

    <div id="ws-equipos"></div>
    <button class="btn-add-equipo" onclick="wsAgregarEquipo()">+ Agregar equipo</button>

    <div class="ws-prev" id="ws-prev">Seleccioná un día para ver el mensaje.</div>
    <div class="ws-actions-row">
      <button class="btn-confirmar" id="btn-confirmar" onclick="wsConfirmarTareas()">✓ Confirmar tareas</button>
      <button class="btn-copy" id="btn-copy" onclick="copiar()">📋 Copiar mensaje</button>
      <button class="btn-img" id="btn-img" onclick="generarImagen()">🖼 Copiar como imagen</button>
    </div>
  </div>
  <canvas id="ws-canvas" style="display:none;"></canvas>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)cerrarModal()">
  <div class="modal">
    <div class="modal-title" id="m-title"></div>
    <div class="modal-sub"   id="m-sub"></div>
    <div class="modal-label">Fecha asignada</div>
    <input type="date" class="modal-fecha" id="m-fecha">
    <div class="modal-label" style="margin-top:10px;">Turno</div>
    <div class="turno-row">
      <button class="turno-btn active" id="t-man" onclick="setTurno('mañana')">☀️ Mañana</button>
      <button class="turno-btn"        id="t-tar" onclick="setTurno('tarde')">🌙 Tarde</button>
    </div>
    <div class="modal-actions">
      <button class="mbtn green" onclick="accion('realizado')">✓ Marcar como REALIZADO</button>
      <div class="mbtn-row">
        <button class="mbtn amber" onclick="accion('guardar')">💾 Guardar fecha</button>
        <button class="mbtn red"   onclick="accion('vencido')">✗ Marcar VENCIDO</button>
      </div>
      <button class="mbtn ghost" onclick="accion('quitar')">🗑 Quitar — enviar a pendientes sin fecha</button>
      <button class="mbtn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
// ── CONSTANTES ──────────────────────────────────────────────────────────────
const MESES   = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                 "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_C  = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DIAS_F  = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const TEC_LBL = {
  "Camilo,Pablo": "Camilo + Pablo",
  "Matias,Nacho": "Matías + Nacho",
};

const HOY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

// ── ESTADO ───────────────────────────────────────────────────────────────────
let pivote   = getMondayOf(new Date()); // lunes de la semana visible
let año      = pivote.getFullYear();
let mes      = pivote.getMonth() + 1;
let modo     = "auto";
let mants    = [], visitas = [], celdas = [], arrastrados = [];
let modalKey    = null; // "mantId_semana_visitaNum" (mes actual)
let modalOrigen = null; // { año, mes } reales de la visita abierta con abrirModal (puede ser "prestada" de otro mes)
let modalArr    = null; // { mant_id, semana, visita_num, año, mes } (arrastrado de otro mes)

// ── UTILS ────────────────────────────────────────────────────────────────────
function getMondayOf(d) {
  const r = new Date(d); r.setHours(0,0,0,0);
  const dow = r.getDay();
  r.setDate(r.getDate() - (dow === 0 ? 6 : dow - 1));
  return r;
}
function isoDate(d)  { return `${d.getFullYear()}-${zz(d.getMonth()+1)}-${zz(d.getDate())}`; }
function zz(n)       { return String(n).padStart(2,"0"); }
function esc(s)      { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function spin(on)    { document.getElementById("spin").classList.toggle("spinning", on); }

function semanaDelMes(diaNum) { return Math.ceil(diaNum / 7); }

// ── CARGA ────────────────────────────────────────────────────────────────────
async function cargar() {
  spin(true);
  try {
    // La semana visible puede tener días de 2 meses distintos (ej. mié 30/09 a vie 2/10).
    // Traemos los datos de TODOS los meses que toque la semana, no solo el del miércoles,
    // para no perder lo que ya esté cargado en los días del mes "siguiente".
    const combosMap = new Map();
    weekDays().forEach(d => {
      const a = d.getFullYear(), m = d.getMonth() + 1;
      combosMap.set(`${a}-${m}`, { año: a, mes: m });
    });
    const combos = Array.from(combosMap.values()).sort((x, y) => (x.año - y.año) || (x.mes - y.mes));

    const resultados = await Promise.all(
      combos.map(c => fetch(`/api/agenda/${c.año}/${c.mes}`).then(r => r.json()))
    );
    const conError = resultados.find(d => !d.ok);
    if (conError) { console.error(conError.error); return; }

    mants   = resultados[0].mantenimientos || [];
    visitas = [];
    celdas  = [];
    resultados.forEach(d => {
      visitas.push(...(d.visitas || []));
      celdas.push(...(d.celdas  || []));
    });
    arrastrados = resultados[resultados.length - 1].arrastrados || [];

    render();
    // Si el mes principal no tiene ningún mantenimiento cargado, ofrecer generarlos
    const visitasMesPrincipal = visitas.filter(v => String(v.año) === String(año) && String(v.mes) === String(mes));
    if (visitasMesPrincipal.length === 0 && mants.length > 0) {
      const msg = modo === "auto"
        ? `No hay mantenimientos cargados para ${MESES[mes-1]} ${año}.\n¿Completar el mes automáticamente (con fecha asignada)?`
        : `No hay mantenimientos cargados para ${MESES[mes-1]} ${año}.\n¿Generar la lista de pendientes para ubicarlos a mano?`;
      if (confirm(msg)) {
        await doAutoFill(false);
      }
    }
  } finally { spin(false); }
}

async function doAutoFill(confirmar = true) {
  const asignarFecha = modo === "auto";
  if (confirmar) {
    const msg = asignarFecha
      ? `Completar mantenimientos de ${MESES[mes-1]} ${año} con fecha automática?\n\nSolo agrega los que faltan.`
      : `Generar los mantenimientos pendientes de ${MESES[mes-1]} ${año} SIN fecha, para ubicarlos a mano desde "Pendientes"?`;
    if (!confirm(msg)) return;
  }
  spin(true);
  try {
    const r = await fetch(`/api/agenda/auto-fill/${año}/${mes}?asignar_fecha=${asignarFecha}`, { method:"POST" });
    const d = await r.json();
    if (!d.ok) { alert("No se pudo completar el mes. Probá de nuevo en un momento.\n\n" + (d.error||"")); return; }
    // Reemplazar solo las visitas de este mes — conservar las del otro mes si la semana lo cruza
    visitas = visitas.filter(v => !(String(v.año) === String(año) && String(v.mes) === String(mes)));
    visitas.push(...(d.visitas || []));
    render();
  } finally { spin(false); }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  renderResumen();
  renderWeek();
  renderArrastrados();
  renderPendientes();
  fillWsDias();
  renderWsEquipos();
  genMsg();
}

// ARRASTRADOS DE MESES ANTERIORES
function renderArrastrados() {
  const sec = document.getElementById("arr-sec");
  if (!arrastrados.length) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  const html = arrastrados.map((v, idx) => {
    const m = mants.find(x => String(x.id) === String(v.mant_id));
    if (!m) return "";
    const mesNom = MESES[parseInt(v.mes) - 1] || v.mes;
    return `<div class="pend-chip" style="background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35);color:#fde68a;" onclick="abrirModalArrastrado(${idx})">
      <span>${m.nombre}</span>
      <span class="pend-chip-sub">· ${mesNom} ${v.año} · sem ${v.semana}</span>
    </div>`;
  }).join("");
  document.getElementById("arr-list").innerHTML = html;
}

// RESUMEN DEL MES
// Visitas esperadas de un mantenimiento según su patrón (mismo cálculo que auto_fill_mes en el backend)
function visitasEsperadas(m) {
  const patronStr = String(m.semanas_pattern || "1;2;3;4").replace(/^'/, "");
  const sep = patronStr.includes(";") ? ";" : ",";
  const patron = patronStr.split(sep).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  const total = parseInt(m.semanas_mes) || 1;
  const porOcurrencia = patron.length ? Math.max(1, Math.floor(total / patron.length)) : 1;
  const out = [];
  patron.forEach(semana => { for (let v = 1; v <= porOcurrencia; v++) out.push({ semana, visita_num: v }); });
  return out;
}

// Misma regla que el dashboard: verde=realizado, ámbar=programado (tiene fecha),
// rojo=vencido o sin programar todavía. Así los dos lugares siempre coinciden.
function estadoVisual(v) {
  if (!v) return "over";
  if (v.estado === "realizado") return "done";
  if (v.estado === "vencido") return "over";
  return v.fecha_real ? "pending" : "over";
}

function renderResumen() {
  const el = document.getElementById("resumen");
  if (!mants.length) { el.innerHTML = '<span class="res-empty">Sin mantenimientos.</span>'; return; }
  // visitas puede traer datos de 2 meses (semana que cruza de mes) — el resumen es
  // siempre del mes "principal" (el que se está navegando con ‹ / ›).
  const visitasMes = visitas.filter(v => String(v.año) === String(año) && String(v.mes) === String(mes));
  let html = '<span class="res-lbl">Mes:</span>';
  mants.forEach(m => {
    const esperadas = visitasEsperadas(m);
    let dots = "";
    esperadas.forEach(e => {
      const v = visitasMes.find(x => String(x.mant_id) === String(m.id) &&
        String(x.semana) === String(e.semana) && String(x.visita_num || 1) === String(e.visita_num));
      dots += `<span class="res-dot ${estadoVisual(v)}"></span>`;
    });
    html += `<div class="res-chip"><span class="res-nombre">${m.nombre}</span><div class="res-dots">${dots}</div></div>`;
  });
  el.innerHTML = html;
}

// GRILLA SEMANAL
function renderWeek() {
  const dias = weekDays();
  const label = buildSemLabel(dias);
  document.getElementById("sem-label").textContent = label;

  let html = "";
  dias.forEach(dia => {
    const iso   = isoDate(dia);
    const dow   = dia.getDay();
    const esHoy = dia.toDateString() === HOY.toDateString();
    const esPas = dia < HOY;
    const dNum  = dia.getDate();
    const dMes  = dia.getMonth() + 1;
    const dAnio = dia.getFullYear();
    const semDia = semanaDelMes(dNum);

    // visitas cuya fecha_real = este día, O cuya semana coincide y no tienen fecha asignada
    const visHoy = visitas.filter(v => v.fecha_real === iso);

    const cards = visHoy.map(v => {
      const m = mants.find(x => String(x.id) === String(v.mant_id));
      if (!m) return "";
      const esVenc = v.estado === "pendiente" && dia < HOY;
      const st = esVenc ? "vencido" : (v.estado || "pendiente");
      const chk = st === "realizado" ? "✓" : st === "vencido" ? "!" : "";
      const key = `${v.mant_id}_${v.semana}_${v.visita_num || 1}`;
      return `<div class="mcard st-${st}" onclick="abrirModal('${key}')"
        title="${m.nombre} · ${TEC_LBL[m.tecnicos]||m.tecnicos} · ${m.horas_visita}hs">
        <span class="mcard-dot"></span>
        <span class="mcard-body">
          <span class="mcard-nombre">${m.nombre}</span>
          <span class="mcard-tec">${TEC_LBL[m.tecnicos]||m.tecnicos}</span>
        </span>
        <span class="mcard-check">${chk}</span>
      </div>`;
    }).join("");

    const celda = celdas.find(c => String(c.dia) === String(dNum) &&
      String(c.año||año) === String(dAnio) && String(c.mes||mes) === String(dMes) && c.turno === "libre");
    const libreVal = celda ? celda.texto : "";

    const esFinde = dow === 0 || dow === 6;
    const clsDia = [esHoy && "is-today", esPas && "is-past", esFinde && "is-finde"].filter(Boolean).join(" ");
    html += `<div class="day-col ${clsDia}" data-iso="${iso}" data-dia="${dNum}">
      <div class="day-head">
        <span class="day-dow">${DIAS_C[dow]}</span>
        <span class="day-num">${dNum}</span>
        ${dMes !== mes ? `<span class="day-mes">${MESES[dMes-1].substring(0,3)}</span>` : ""}
        ${esHoy ? '<span class="day-hoy-badge">HOY</span>' : ""}
      </div>
      <div class="day-body">
        ${cards}
      </div>
      <div class="libre-wrap">
        <textarea class="libre-ta" placeholder="+ trabajo libre…"
          onblur="guardarLibre(${dNum},${dMes},${dAnio},this.value)"
          rows="1">${esc(libreVal)}</textarea>
      </div>
    </div>`;
  });

  document.getElementById("week-grid").innerHTML = html;
}

// PENDIENTES SIN FECHA
function renderPendientes() {
  const visitasMes = visitas.filter(v => String(v.año) === String(año) && String(v.mes) === String(mes));
  const sin = visitasMes.filter(v => v.estado !== "realizado" && !v.fecha_real);
  const sec = document.getElementById("pend-sec");
  if (!sin.length) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  const html = sin.map(v => {
    const m = mants.find(x => String(x.id) === String(v.mant_id));
    if (!m) return "";
    const key = `${v.mant_id}_${v.semana}_${v.visita_num||1}`;
    return `<div class="pend-chip" onclick="abrirModal('${key}')">
      <span>${m.nombre}</span>
      <span class="pend-chip-sub">· sem ${v.semana} · sin fecha</span>
    </div>`;
  }).join("");
  document.getElementById("pend-list").innerHTML = html;
}

// ── SEMANA ───────────────────────────────────────────────────────────────────
function weekDays() {
  // Lunes a domingo — la mayoría de los trabajos también caen en fin de semana,
  // antes se cortaba en viernes y quedaban invisibles.
  return Array.from({length:7}, (_,i) => {
    const d = new Date(pivote); d.setDate(pivote.getDate() + i); return d;
  });
}

function buildSemLabel(dias) {
  const d0 = dias[0], dN = dias[dias.length - 1];
  const m0 = MESES[d0.getMonth()].substring(0,3);
  const mN = MESES[dN.getMonth()].substring(0,3);
  const mesStr = d0.getMonth() === dN.getMonth()
    ? `${m0} ${d0.getFullYear()}`
    : `${m0} – ${mN} ${dN.getFullYear()}`;
  return `${d0.getDate()} al ${dN.getDate()} de ${mesStr}`;
}

function semAnt() {
  pivote.setDate(pivote.getDate() - 7);
  syncMes();
  cargar();
}
function semSig() {
  pivote.setDate(pivote.getDate() + 7);
  syncMes();
  cargar();
}
function irHoy() {
  pivote = getMondayOf(new Date());
  syncMes();
  cargar();
}
function syncMes() {
  // Usar el mes del miércoles (centro de la semana) para evitar ambigüedad
  const mierc = new Date(pivote); mierc.setDate(pivote.getDate() + 2);
  año = mierc.getFullYear();
  mes = mierc.getMonth() + 1;
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function abrirModal(key) {
  const [mid, semStr, vnumStr] = key.split("_");
  const v = visitas.find(x =>
    String(x.mant_id) === mid &&
    String(x.semana)  === semStr &&
    String(x.visita_num||1) === (vnumStr||"1")
  );
  const m = mants.find(x => String(x.id) === mid);
  if (!m) return;
  modalKey = key;
  // La visita puede venir "prestada" de otro mes de origen (reprogramada para una fecha
  // de este mes) — hay que guardar y usar SU año/mes real, no el mes que se está viendo,
  // si no el guardado posterior crea una fila fantasma en el mes equivocado.
  modalOrigen = { año: v?.año || año, mes: v?.mes || mes };
  document.getElementById("m-title").textContent = m.nombre;
  document.getElementById("m-sub").textContent =
    `${TEC_LBL[m.tecnicos]||m.tecnicos} · ${m.horas_visita}hs · Semana ${semStr}`;
  const fechaInp = document.getElementById("m-fecha");
  fechaInp.value = v?.fecha_real || "";
  fechaInp.min   = new Date().toISOString().split("T")[0];
  setTurno(v?.turno || "mañana");
  document.getElementById("overlay").classList.add("open");
}
function abrirModalArrastrado(idx) {
  const v = arrastrados[idx];
  const m = mants.find(x => String(x.id) === String(v.mant_id));
  if (!m) return;
  modalKey = null;
  modalArr = { mant_id: v.mant_id, semana: v.semana, visita_num: v.visita_num || 1,
               año: v.año, mes: v.mes };
  const mesNom = MESES[parseInt(v.mes) - 1] || v.mes;
  document.getElementById("m-title").textContent = m.nombre;
  document.getElementById("m-sub").textContent =
    `${TEC_LBL[m.tecnicos]||m.tecnicos} · ${m.horas_visita}hs · Arrastrado de ${mesNom} ${v.año} (sem ${v.semana})`;
  const fechaInp2 = document.getElementById("m-fecha");
  fechaInp2.value = v.fecha_real || "";
  fechaInp2.min   = new Date().toISOString().split("T")[0];
  setTurno(v.turno || "mañana");
  document.getElementById("overlay").classList.add("open");
}

function cerrarModal() {
  document.getElementById("overlay").classList.remove("open");
  modalKey    = null;
  modalOrigen = null;
  modalArr    = null;
}
function setTurno(t) {
  document.getElementById("t-man").classList.toggle("active", t === "mañana");
  document.getElementById("t-tar").classList.toggle("active", t === "tarde");
  if (modalKey) {
    const [mid,s,vn] = modalKey.split("_");
    const idx = visitas.findIndex(x => String(x.mant_id)===mid && String(x.semana)===s && String(x.visita_num||1)===(vn||"1"));
    if (idx >= 0) visitas[idx]._pendTurno = t;
    else window._pendTurno = t;
  }
  window._modalTurno = t;
}

async function accion(tipo) {
  if (!modalKey && !modalArr) return;

  if (modalArr) {
    const fecha = tipo === "quitar" ? "" : (document.getElementById("m-fecha").value || modalArr.fecha_real || "");
    const turno = window._modalTurno || modalArr.turno || "mañana";
    const estado = (tipo === "guardar" || tipo === "quitar") ? "pendiente" : tipo;
    if (tipo === "guardar" && !fecha) { alert("Ingresá una fecha."); return; }
    await saveVisita({ ...modalArr, fecha_real: fecha, estado, turno }, modalArr.año, modalArr.mes);
    cerrarModal();
    return;
  }

  const [mid, semStr, vnumStr] = modalKey.split("_");
  const v = visitas.find(x =>
    String(x.mant_id) === mid && String(x.semana) === semStr &&
    String(x.visita_num||1) === (vnumStr||"1")
  );
  const fecha = tipo === "quitar" ? "" : (document.getElementById("m-fecha").value || v?.fecha_real || "");
  const turno = window._modalTurno || v?.turno || "mañana";
  const estado = (tipo === "guardar" || tipo === "quitar") ? "pendiente" : tipo;

  if (tipo === "guardar" && !fecha) { alert("Ingresá una fecha."); return; }

  // Usar el año/mes REAL de la visita (puede estar "prestada" de otro mes de origen),
  // no el mes que se está viendo — si no, esto crea una fila fantasma en el mes equivocado
  // y la visita original nunca se toca (el bug de "no se borra").
  const { año: origAño, mes: origMes } = modalOrigen || { año, mes };
  await saveVisita({ mant_id:mid, semana:parseInt(semStr), visita_num:parseInt(vnumStr||1),
                     fecha_real:fecha, estado, turno }, origAño, origMes);
  cerrarModal();
}

async function saveVisita(data, targetAño = año, targetMes = mes) {
  spin(true);
  try {
    await fetch("/api/agenda/visita", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ mant_id:data.mant_id, año:targetAño, mes:targetMes,
        semana:data.semana, visita_num:data.visita_num||1,
        fecha_real:data.fecha_real||"", estado:data.estado||"pendiente", turno:data.turno||"mañana" }),
    });
    // visitas puede tener datos de más de un mes (semana que cruza de mes) — matchear
    // siempre por la clave completa (mant_id + año + mes + semana + visita_num).
    const upd = { mant_id:String(data.mant_id), año:String(targetAño), mes:String(targetMes),
      semana:String(data.semana), visita_num:String(data.visita_num||1),
      fecha_real:data.fecha_real||"", estado:data.estado||"pendiente", turno:data.turno||"mañana" };
    const idx = visitas.findIndex(x =>
      String(x.mant_id)===String(data.mant_id) && String(x.año)===String(targetAño) &&
      String(x.mes)===String(targetMes) && String(x.semana)===String(data.semana) &&
      String(x.visita_num||1)===String(data.visita_num||1));
    if (idx>=0) visitas[idx]=upd; else visitas.push(upd);
    // Si estaba en arrastrados y ahora se resolvió (o se le asignó fecha), sacarlo de ahí
    arrastrados = arrastrados.filter(x =>
      !(String(x.mant_id)===String(data.mant_id) && String(x.año)===String(targetAño) &&
        String(x.mes)===String(targetMes) && String(x.semana)===String(data.semana) &&
        String(x.visita_num||1)===String(data.visita_num||1)));
    render();
  } finally { spin(false); }
}

// ── LIBRE ─────────────────────────────────────────────────────────────────────
async function guardarLibre(dia, dMes, dAnio, texto) {
  const body = { año:dAnio, mes:dMes, dia, turno:"libre", texto, color:"", negrita:false };
  await fetch("/api/agenda/celda", { method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  const upd = { año:String(dAnio), mes:String(dMes), dia:String(dia), turno:"libre", texto, color:"", negrita:"no" };
  const idx = celdas.findIndex(c => String(c.dia)===String(dia) && String(c.año||año)===String(dAnio) &&
    String(c.mes||mes)===String(dMes) && c.turno==="libre");
  if (idx>=0) celdas[idx]=upd; else celdas.push(upd);
  fillWsDias(); genMsg();
}

// ── WS GENERATOR ─────────────────────────────────────────────────────────────
function fillWsDias() {
  const sel = document.getElementById("ws-dia");
  const prev = sel.value;
  // Mostrar próximos 14 días (incluye fin de semana — el operador suele trabajar sábados/domingos)
  let opts = `<option value="">— Seleccionar —</option>`;
  for (let i = 1; i <= 14; i++) {
    const d = new Date(HOY); d.setDate(HOY.getDate() + i);
    const dow = d.getDay();
    const iso = isoDate(d);
    const lbl = `${DIAS_F[dow]} ${d.getDate()}/${zz(d.getMonth()+1)}`;
    opts += `<option value="${iso}">${lbl}</option>`;
  }
  sel.innerHTML = opts;
  if (prev) sel.value = prev;
}

// ── EQUIPOS DE TRABAJO ───────────────────────────────────────────────────────
const TECNICOS_ALL = ["Camilo","Pablo","Matias","Nacho"];
let wsEquipos = []; // [{ tecnicos:[...], tareas:[{tipo:'mant',año,mes,mant_id,semana,visita_num,label} | {tipo:'libre',texto}] }]

function tareaKey(t) { return `${t.año}_${t.mes}_${t.mant_id}_${t.semana}_${t.visita_num}`; }

function wsPendientesPool() {
  const usados = new Set();
  wsEquipos.forEach(eq => eq.tareas.forEach(t => { if (t.tipo === "mant") usados.add(tareaKey(t)); }));
  const pool = [];
  // visitas puede traer datos de 2 meses (semana que cruza de mes) — usar el año/mes
  // de cada registro, no el mes "principal" global, para no mezclar meses distintos.
  visitas.filter(v => v.estado !== "realizado" && !v.fecha_real).forEach(v => {
    const m = mants.find(x => String(x.id) === String(v.mant_id));
    if (!m) return;
    const t = { tipo:"mant", año:v.año, mes:v.mes, mant_id:v.mant_id, semana:v.semana, visita_num:v.visita_num||1,
                label:`${m.nombre} (${m.horas_visita}hs)` };
    const k = tareaKey(t);
    if (!usados.has(k)) { usados.add(k); pool.push(t); }
  });
  // arrastrados puede repetir algo que 'visitas' ya trajo (semana que cruza justo a fin de
  // mes) — el Set 'usados' ya lo filtra acá.
  arrastrados.forEach(v => {
    const m = mants.find(x => String(x.id) === String(v.mant_id));
    if (!m) return;
    const t = { tipo:"mant", año:v.año, mes:v.mes, mant_id:v.mant_id, semana:v.semana, visita_num:v.visita_num||1,
                label:`${m.nombre} (${m.horas_visita}hs) · arrastrado` };
    const k = tareaKey(t);
    if (!usados.has(k)) { usados.add(k); pool.push(t); }
  });
  return pool;
}

function wsPoblarDesdeDia(iso) {
  wsEquipos = [];
  if (!iso) return;
  const visHoy = visitas.filter(v => v.fecha_real === iso && v.estado !== "realizado");
  const grupos = {};
  visHoy.forEach(v => {
    const m = mants.find(x => String(x.id) === String(v.mant_id));
    if (!m) return;
    const tecStr = m.tecnicos || "";
    if (!grupos[tecStr]) grupos[tecStr] = { tecnicos: tecStr.split(",").map(s=>s.trim()).filter(Boolean), tareas: [] };
    grupos[tecStr].tareas.push({ tipo:"mant", año, mes, mant_id:v.mant_id, semana:v.semana, visita_num:v.visita_num||1,
                                  turno: v.turno || "mañana", confirmado:true, label:`${m.nombre} (${m.horas_visita}hs)` });
  });
  wsEquipos = Object.values(grupos);
}

function wsAgregarEquipo() {
  wsEquipos.push({ tecnicos: [], tareas: [] });
  renderWsEquipos(); genMsg();
}

function wsQuitarEquipo(idx) {
  wsEquipos.splice(idx, 1);
  renderWsEquipos(); genMsg();
}

function wsToggleTecnico(idx, nombre) {
  const eq = wsEquipos[idx];
  const i = eq.tecnicos.indexOf(nombre);
  if (i >= 0) eq.tecnicos.splice(i, 1); else eq.tecnicos.push(nombre);
  renderWsEquipos(); genMsg();
}

function wsSetTareaTurno(idx, tIdx, t) {
  const tarea = wsEquipos[idx].tareas[tIdx];
  tarea.turno = t;
  tarea.confirmado = false; // el cambio de turno necesita re-confirmarse para guardarse
  renderWsEquipos(); genMsg();
}

function wsAgregarTareaPendiente(idx, selectEl) {
  const val = selectEl.value;
  if (!val) return;
  const [añoT, mesT, mantId, semana, visitaNum] = val.split("_");
  const m = mants.find(x => String(x.id) === String(mantId));
  const tarea = { tipo:"mant", año:parseInt(añoT), mes:parseInt(mesT), mant_id:mantId,
                  semana:parseInt(semana), visita_num:parseInt(visitaNum), turno:"mañana", confirmado:false,
                  label:`${m ? m.nombre : mantId} (${m ? m.horas_visita : "?"}hs)` };
  wsEquipos[idx].tareas.push(tarea);
  renderWsEquipos(); genMsg();
}

async function wsQuitarTarea(idx, tIdx) {
  const t = wsEquipos[idx].tareas[tIdx];
  wsEquipos[idx].tareas.splice(tIdx, 1);
  if (t.tipo === "mant" && t.confirmado) {
    await saveVisita({ mant_id:t.mant_id, semana:t.semana, visita_num:t.visita_num,
                        fecha_real:"", estado:"pendiente", turno:"mañana" }, t.año, t.mes);
  }
  renderWsEquipos(); genMsg();
}

async function wsConfirmarTareas() {
  const iso = document.getElementById("ws-dia").value;
  if (!iso) { alert("Elegí un día primero."); return; }

  const pendientesMant  = [];
  const pendientesLibre = [];
  wsEquipos.forEach(eq => eq.tareas.forEach(t => {
    if (t.confirmado) return;
    (t.tipo === "mant" ? pendientesMant : pendientesLibre).push(t);
  }));
  if (!pendientesMant.length && !pendientesLibre.length) return;

  const btn = document.getElementById("btn-confirmar");
  btn.disabled = true; btn.textContent = "Confirmando…";

  for (const t of pendientesMant) {
    await saveVisita({ mant_id:t.mant_id, semana:t.semana, visita_num:t.visita_num,
                        fecha_real: iso, estado:"pendiente", turno: t.turno || "mañana" }, t.año, t.mes);
    t.confirmado = true;
  }

  if (pendientesLibre.length) {
    // El texto libre del generador no se guardaba en ningún lado — quedaba solo en el
    // mensaje y desaparecía al recargar. Ahora se agrega al "trabajo libre" del día,
    // así queda visible en la grilla semanal como cualquier otra nota del día.
    const dia   = new Date(iso + "T00:00:00");
    const dNum  = dia.getDate();
    const dMes  = dia.getMonth() + 1;
    const dAnio = dia.getFullYear();
    const celdaActual = celdas.find(c => String(c.dia) === String(dNum) &&
      String(c.año||año) === String(dAnio) && String(c.mes||mes) === String(dMes) && c.turno === "libre");
    const previo = celdaActual ? celdaActual.texto : "";
    const nuevasLineas = pendientesLibre.map(t => t.texto).join("\n");
    const textoFinal = previo ? `${previo}\n${nuevasLineas}` : nuevasLineas;
    await guardarLibre(dNum, dMes, dAnio, textoFinal);
    pendientesLibre.forEach(t => t.confirmado = true);
  }

  render();
  btn.textContent = "✓ Confirmado";
  setTimeout(() => { btn.textContent = "✓ Confirmar tareas"; btn.disabled = false; }, 1500);
}

function wsAgregarLibre(idx, inputEl) {
  const txt = inputEl.value.trim();
  if (!txt) return;
  wsEquipos[idx].tareas.push({ tipo:"libre", texto: txt, turno:"mañana", confirmado:false });
  inputEl.value = "";
  renderWsEquipos(); genMsg();
}

function renderWsEquipos() {
  const cont = document.getElementById("ws-equipos");
  const pool = wsPendientesPool();
  const poolOpts = pool.map(p =>
    `<option value="${p.año}_${p.mes}_${p.mant_id}_${p.semana}_${p.visita_num}">${p.label}</option>`
  ).join("");

  cont.innerHTML = wsEquipos.map((eq, idx) => {
    const chks = TECNICOS_ALL.map(n =>
      `<span class="ws-tec-chk ${eq.tecnicos.includes(n)?'active':''}" onclick="wsToggleTecnico(${idx},'${n}')">${n}</span>`
    ).join("");
    const tareasHtml = eq.tareas.map((t, tIdx) => {
      const turno = t.turno || "mañana";
      const sinConfirmar = !t.confirmado;
      return `
      <div class="ws-tarea-item ${sinConfirmar ? 'sin-confirmar' : ''}">
        <span>${t.tipo==="mant" ? esc(t.label) : esc(t.texto)}${sinConfirmar ? ' <em class="ws-tarea-flag">sin confirmar</em>' : ''}</span>
        <div class="ws-tarea-right">
          <span class="ws-turno-btn ${turno==='mañana'?'active':''}" onclick="wsSetTareaTurno(${idx},${tIdx},'mañana')" title="Mañana">☀️</span>
          <span class="ws-turno-btn ${turno==='tarde'?'active':''}" onclick="wsSetTareaTurno(${idx},${tIdx},'tarde')" title="Tarde">🌙</span>
          <span class="ws-tarea-rm" onclick="wsQuitarTarea(${idx},${tIdx})">✕</span>
        </div>
      </div>`;
    }).join("") || `<div class="ws-tarea-empty">Sin tareas todavía</div>`;

    return `<div class="ws-equipo">
      <div class="ws-equipo-head">
        <div class="ws-tec-chks">${chks}</div>
        <span class="ws-equipo-rm" onclick="wsQuitarEquipo(${idx})">✕ Quitar equipo</span>
      </div>
      <div class="ws-tareas">${tareasHtml}</div>
      <div class="ws-tarea-add">
        <select class="ws-sel-sm" onchange="wsAgregarTareaPendiente(${idx},this)">
          <option value="">+ Desde pendientes…</option>
          ${poolOpts}
        </select>
        <input type="text" class="ws-inp-sm" id="ws-libre-${idx}" placeholder="+ Texto libre…"
          onkeydown="if(event.key==='Enter'){event.preventDefault();wsAgregarLibre(${idx},this);}">
        <button type="button" class="ws-btn-agregar" onclick="wsAgregarLibre(${idx},document.getElementById('ws-libre-${idx}'))">+ Agregar</button>
      </div>
    </div>`;
  }).join("");
}

function genMsg() {
  const iso  = document.getElementById("ws-dia").value;
  const nota = document.getElementById("ws-nota").value.trim();
  const prev = document.getElementById("ws-prev");
  if (!iso) { prev.textContent = "Seleccioná un día para ver el mensaje."; return; }

  const dia   = new Date(iso + "T00:00:00");
  const dow   = dia.getDay();
  const dNum  = dia.getDate();
  const dMes  = dia.getMonth() + 1;

  const celda = celdas.find(c => String(c.dia)===String(dNum) &&
    String(c.mes||mes)===String(dMes) && c.turno==="libre");

  const fechaFmt = `${DIAS_F[dow].toUpperCase()} ${dNum} DE ${MESES[dMes-1].toUpperCase()}`;
  const marco = "✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦";
  let msg = `${marco}\n\n🔧 *AGENDA DEL DÍA*\n\n*${fechaFmt}*\n\n${marco}\n`;

  const hayContenido = wsEquipos.some(eq => eq.tareas.length) || celda?.texto;
  if (!hayContenido) {
    msg += "\nSin mantenimientos programados para este día.\n";
  } else {
    wsEquipos.forEach(eq => {
      if (!eq.tareas.length) return;
      const nombreEquipo = eq.tecnicos.length
        ? eq.tecnicos.join(" + ").toUpperCase()
        : "SIN EQUIPO ASIGNADO";
      msg += `\n\n👷 *${nombreEquipo}*\n`;
      eq.tareas.forEach(t => {
        const turnoIcono = t.turno === "tarde" ? "🌙" : "☀️";
        const turnoLbl   = t.turno === "tarde" ? "Turno tarde" : "Turno mañana";
        const texto      = t.tipo === "mant" ? t.label : t.texto;
        msg += `\n   • _*${texto}*_\n      ${turnoIcono} ${turnoLbl}\n`;
      });
    });
    if (celda?.texto) msg += `\n\n📋 *ADEMÁS:*\n${celda.texto}\n`;
  }
  if (nota) msg += `\n\n📌 ${nota}`;
  msg += `\n\n${marco}`;
  prev.textContent = msg;
}

function copiar() {
  const txt = document.getElementById("ws-prev").textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById("btn-copy");
    btn.textContent = "✓ Copiado"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "📋 Copiar mensaje"; btn.classList.remove("copied"); }, 2000);
  });
}

// ── IMAGEN PARA WHATSAPP (tipo cartel) ────────────────────────────────────────
let _wsLogoImg = null;
function wsLoadLogo() {
  return new Promise(resolve => {
    if (_wsLogoImg) { resolve(_wsLogoImg); return; }
    const img = new Image();
    img.onload  = () => { _wsLogoImg = img; resolve(img); };
    img.onerror = () => resolve(null);
    img.src = "/static/logo-gateway.jpeg";
  });
}

function wsWrapText(ctx, text, maxWidth) {
  const words = String(text).split(" ");
  const lines = [];
  let actual = "";
  words.forEach(w => {
    const test = actual ? actual + " " + w : w;
    if (ctx.measureText(test).width > maxWidth && actual) { lines.push(actual); actual = w; }
    else actual = test;
  });
  if (actual) lines.push(actual);
  return lines;
}

function wsRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wsBuildModel() {
  const iso  = document.getElementById("ws-dia").value;
  const nota = document.getElementById("ws-nota").value.trim();
  if (!iso) return null;

  const dia   = new Date(iso + "T00:00:00");
  const dow   = dia.getDay();
  const dNum  = dia.getDate();
  const dMes  = dia.getMonth() + 1;
  const fechaFmt = `${DIAS_F[dow].toUpperCase()} ${dNum} DE ${MESES[dMes-1].toUpperCase()}`;

  const celda = celdas.find(c => String(c.dia)===String(dNum) &&
    String(c.mes||mes)===String(dMes) && c.turno==="libre");

  const equipos = wsEquipos
    .filter(eq => eq.tareas.length)
    .map(eq => ({
      nombre: eq.tecnicos.length ? eq.tecnicos.join(" + ").toUpperCase() : "SIN EQUIPO ASIGNADO",
      tareas: eq.tareas.map(t => ({
        texto: t.tipo === "mant" ? t.label : t.texto,
        turno: t.turno === "tarde" ? "tarde" : "mañana",
      })),
    }));

  return { iso, fechaFmt, equipos, ademas: celda?.texto || "", nota };
}

async function generarImagen() {
  const modelo = wsBuildModel();
  if (!modelo) { alert("Elegí un día primero."); return; }

  const btn = document.getElementById("btn-img");
  const txtOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = "Generando…";

  try {
    const logo = await wsLoadLogo();
    const canvas = document.getElementById("ws-canvas");
    const ctx = canvas.getContext("2d");

    const W = 720, PAD = 44, DPR = 2;
    const contentW = W - PAD * 2;
    const GAP  = 16;
    const colW = (contentW - GAP) / 2;
    const fFamily = "'Montserrat', 'Segoe UI', sans-serif";

    // Arma la grilla de 2 columnas por equipo (misma estructura para medir y dibujar,
    // así las dos pasadas siempre coinciden en alto).
    const equiposLayout = modelo.equipos.map(eq => {
      const cards = eq.tareas.map(t => {
        ctx.font = `700 14px ${fFamily}`;
        const lineas = wsWrapText(ctx, t.texto, colW - 28);
        const turnoIcono = t.turno === "tarde" ? "🌙" : "☀️";
        const turnoLbl   = t.turno === "tarde" ? "Turno tarde" : "Turno mañana";
        const h = 16 + lineas.length * 18 + 10 + 18 + 14;
        return { lineas, turnoIcono, turnoLbl, h };
      });
      const filas = [];
      for (let i = 0; i < cards.length; i += 2) {
        const par = [cards[i], cards[i + 1] || null];
        filas.push({ par, h: Math.max(par[0].h, par[1]?.h || 0) });
      }
      return { nombre: eq.nombre, filas };
    });

    // ── Pasada 1: medir alto total ──
    let y = PAD;
    if (logo) y += 56 + 18;
    y += 30 + 22 + 14 + 24; // título + fecha + espacio + divisor

    if (!modelo.equipos.length && !modelo.ademas) y += 24;

    equiposLayout.forEach(eq => {
      y += 34; // chip del equipo
      eq.filas.forEach(fila => { y += fila.h + 12; });
      y += 10;
    });
    if (modelo.ademas) {
      ctx.font = `400 13px ${fFamily}`;
      y += 20 + wsWrapText(ctx, modelo.ademas, contentW).length * 19 + 10;
    }
    if (modelo.nota) {
      ctx.font = `400 13px ${fFamily}`;
      y += wsWrapText(ctx, `📌 ${modelo.nota}`, contentW).length * 19;
    }
    y += PAD;
    const H = Math.round(y);

    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    ctx.scale(DPR, DPR);

    // ── Fondo tipo cartel, claro ──
    ctx.fillStyle = "#FDFDFE";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#0F1F3D"; ctx.lineWidth = 3;
    ctx.strokeRect(6, 6, W - 12, H - 12);
    ctx.strokeStyle = "#3B82F6"; ctx.lineWidth = 1;
    ctx.strokeRect(12, 12, W - 24, H - 24);

    let cy = PAD;
    if (logo) {
      const ratio = logo.naturalWidth ? logo.naturalHeight / logo.naturalWidth : 0.35;
      const lw = 160, lh = Math.min(lw * ratio, 56);
      ctx.drawImage(logo, (W - lw) / 2, cy, lw, lh);
      cy += 56 + 18;
    }

    ctx.textAlign = "center";
    ctx.fillStyle = "#0F1F3D";
    ctx.font = `800 24px ${fFamily}`;
    ctx.fillText("🔧 AGENDA DEL DÍA", W / 2, cy + 20);
    cy += 30;

    ctx.fillStyle = "#3B82F6";
    ctx.font = `700 16px ${fFamily}`;
    ctx.fillText(modelo.fechaFmt, W / 2, cy + 14);
    cy += 22 + 14;

    ctx.strokeStyle = "#E2E5EA"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(PAD, cy); ctx.lineTo(W - PAD, cy); ctx.stroke();
    cy += 24;

    ctx.textAlign = "left";
    if (!modelo.equipos.length && !modelo.ademas) {
      ctx.fillStyle = "#6B7280";
      ctx.font = `400 14px ${fFamily}`;
      ctx.textAlign = "center";
      ctx.fillText("Sin mantenimientos programados para este día.", W / 2, cy);
      cy += 24;
      ctx.textAlign = "left";
    }

    equiposLayout.forEach(eq => {
      // Chip del equipo, centrado
      const chipText = `👷 ${eq.nombre}`;
      ctx.font = `700 15px ${fFamily}`;
      const chipW = Math.min(contentW, ctx.measureText(chipText).width + 28);
      const chipX = (W - chipW) / 2;
      ctx.fillStyle = "#EAF2FF";
      wsRoundRect(ctx, chipX, cy - 6, chipW, 28, 8);
      ctx.fill();
      ctx.textAlign = "center";
      ctx.fillStyle = "#0F1F3D";
      ctx.fillText(chipText, W / 2, cy + 13);
      ctx.textAlign = "left";
      cy += 34;

      // Tareas en grilla simétrica de 2 columnas
      eq.filas.forEach(fila => {
        fila.par.forEach((card, idx) => {
          if (!card) return;
          const x = PAD + idx * (colW + GAP);
          ctx.fillStyle = "#FFFFFF";
          ctx.strokeStyle = "#D7DEE8";
          ctx.lineWidth = 1.2;
          wsRoundRect(ctx, x, cy, colW, fila.h, 10);
          ctx.fill();
          ctx.stroke();

          let ty = cy + 16 + 12;
          ctx.font = `700 14px ${fFamily}`;
          ctx.fillStyle = "#1F2937";
          card.lineas.forEach(linea => { ctx.fillText(linea, x + 14, ty); ty += 18; });
          ty += 8;
          ctx.font = `400 12px ${fFamily}`;
          ctx.fillStyle = "#6B7280";
          ctx.fillText(`${card.turnoIcono}  ${card.turnoLbl}`, x + 14, ty);
        });
        cy += fila.h + 12;
      });
      cy += 10;
    });

    if (modelo.ademas) {
      cy += 10;
      ctx.font = `700 14px ${fFamily}`;
      ctx.fillStyle = "#0F1F3D";
      ctx.fillText("📋 ADEMÁS:", PAD, cy);
      cy += 20;
      ctx.font = `400 13px ${fFamily}`;
      ctx.fillStyle = "#374151";
      wsWrapText(ctx, modelo.ademas, contentW).forEach(linea => { ctx.fillText(linea, PAD, cy); cy += 19; });
    }
    if (modelo.nota) {
      cy += 6;
      ctx.font = `italic 400 13px ${fFamily}`;
      ctx.fillStyle = "#6B7280";
      wsWrapText(ctx, `📌 ${modelo.nota}`, contentW).forEach(linea => { ctx.fillText(linea, PAD, cy); cy += 19; });
    }

    canvas.toBlob(async (blob) => {
      if (!blob) { alert("No se pudo generar la imagen."); btn.disabled=false; btn.textContent=txtOriginal; return; }
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        btn.textContent = "✓ Copiada"; btn.classList.add("copied");
        setTimeout(() => { btn.textContent = txtOriginal; btn.classList.remove("copied"); btn.disabled=false; }, 2000);
      } catch (e) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `agenda-${modelo.iso}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        btn.textContent = "⬇ Descargada";
        setTimeout(() => { btn.textContent = txtOriginal; btn.disabled=false; }, 2000);
      }
    }, "image/png");
  } catch (e) {
    console.error(e);
    alert("No se pudo generar la imagen. Probá de nuevo.");
    btn.disabled = false; btn.textContent = txtOriginal;
  }
}

// ── MODO ──────────────────────────────────────────────────────────────────────
function setModo(m) {
  modo = m;
  document.getElementById("btn-auto").classList.toggle("active", m==="auto");
  document.getElementById("btn-manual").classList.toggle("active", m==="manual");
  document.getElementById("btn-fill").textContent =
    m === "auto" ? "↻ Completar mes" : "+ Generar pendientes del mes";
  try { localStorage.setItem("ag_modo", m); } catch(e){}
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  try { modo = localStorage.getItem("ag_modo") || "auto"; } catch(e){}
  setModo(modo);
  syncMes();
  cargar();
});
